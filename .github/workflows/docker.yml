name: Test and publish Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test first boot and persistent data mount
        shell: bash
        run: |
          docker build -t order-monitor:smoke .
          data_dir=$(mktemp -d)
          docker run -d --name monitor-smoke -p 127.0.0.1:18080:8080 -e ADMIN_TOKEN=ci-smoke-token-123456 -v "$data_dir:/data" order-monitor:smoke
          trap 'docker logs monitor-smoke; docker rm -f monitor-smoke' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          docker exec monitor-smoke python -c "from pathlib import Path; assert '10001' in next(x for x in Path('/proc/1/status').read_text().splitlines() if x.startswith('Uid:'))"
          curl -fsS -c /tmp/monitor-cookies -H 'Content-Type: application/json' -d '{"token":"ci-smoke-token-123456"}' http://127.0.0.1:18080/api/login
          curl -fsS -b /tmp/monitor-cookies -H 'Content-Type: application/json' -d '{"interval":42}' http://127.0.0.1:18080/api/settings
          docker restart monitor-smoke
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          curl -fsS -b /tmp/monitor-cookies http://127.0.0.1:18080/api/state | python -c "import json,sys; assert json.load(sys.stdin)['settings']['interval']==42"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
