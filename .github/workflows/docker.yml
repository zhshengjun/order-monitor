name: Test and publish Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: node --check internal/web/static/app.js
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Smoke test first boot and persistent data mount
        shell: bash
        run: |
          docker build -t order-monitor:smoke .
          data_dir=$(mktemp -d)
          docker run -d --name monitor-smoke -p 127.0.0.1:18080:8080 -e ADMIN_TOKEN=ci-smoke-token-123456 -v "$data_dir:/data" order-monitor:smoke
          trap 'docker logs monitor-smoke; docker rm -f monitor-smoke' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          docker exec monitor-smoke sh -c "grep -E '^Uid:[[:space:]]+10001[[:space:]]' /proc/1/status"
          curl -fsS -c /tmp/monitor-cookies -H 'Content-Type: application/json' -d '{"token":"ci-smoke-token-123456"}' http://127.0.0.1:18080/api/login
          curl -fsS -b /tmp/monitor-cookies -H 'Content-Type: application/json' -d '{"interval":42}' http://127.0.0.1:18080/api/settings
          docker restart monitor-smoke
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          curl -fsS -b /tmp/monitor-cookies http://127.0.0.1:18080/api/state | python -c "import json,sys; assert json.load(sys.stdin)['settings']['interval']==42"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
